<div class="transaction-card">
    <p>{{ transaction().transactionName }}</p>
    <p>{{ transaction().amount | currency}}</p>
    <p>{{ transaction().dateCreated | date: 'shortDate'}}</p>
    <button (click)="handleAddTagClicked()" *ngIf="showButton()" id="add-tag-button">+ Add Tag</button>
</div>
