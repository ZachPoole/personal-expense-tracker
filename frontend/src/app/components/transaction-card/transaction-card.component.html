<div [class]="{ 'text-center': inModal() }" class="transaction-card">
  <p>{{ transaction().name }}</p>
  <p>{{ transaction().amount | currency }}</p>
  <p>{{ transaction().dateCreated | date : "shortDate" }}</p>
  <button
    (click)="handleAddTagClicked()"
    *ngIf="showButton()"
    id="add-tag-button"
  >
    + Add Tag
  </button>
</div>
