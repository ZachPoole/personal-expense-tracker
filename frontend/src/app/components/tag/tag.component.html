<div
  id="tag-wrapper"
  [ngClass]="{ selectable: selectable(), selected: selected() }"
  [class]="'bg-' + tag().color.color.toLowerCase()"
  (click)="handleTagSelected()"
>
  <p>{{ tag().name }}</p>
  <mat-icon
    (click)="handleDeleteClicked()"
    id="delete-tag-icon"
    *ngIf="allowDelete()"
    >close</mat-icon
  >
</div>
