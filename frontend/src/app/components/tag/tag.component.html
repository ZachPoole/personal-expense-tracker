<div
  id="tag-wrapper"
  [ngClass]="{ clickable: selectable() && !disabled(), disabled: disabled() }"
  [class]="'bg-' + tag().color"
  (click)="handleTagSelected()"
>
  <p>{{ tag().name }}</p>
  <mat-icon
    (click)="handleDeleteClicked()"
    id="delete-tag-icon"
    *ngIf="allowDelete()"
    >close</mat-icon
  >
</div>
