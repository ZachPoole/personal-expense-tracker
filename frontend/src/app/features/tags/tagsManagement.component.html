<div id="tags-component">
  <h1 id="tags-header">Tags</h1>

  <button (click)="handleCreateTagClicked()" id="create-tag-tag">
    + Create Tag
  </button>
  <div id="tag-list">
    <app-tag
      *ngFor="let tag of tags()"
      [tag]="tag"
      [allowDelete]="true"
      [selectable]="false"
    ></app-tag>
  </div>

  <div *ngIf="showModal()" id="create-tag-modal-wrapper">
    <app-create-tag-modal
      (closeModalClicked)="closeModalClicked()"
    ></app-create-tag-modal>
  </div>
</div>
