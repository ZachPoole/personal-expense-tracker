<div id="dashboard-component">
  <h1 id="dashboard-header">Tagless Transactions</h1>
  
  <div id="transaction-list">
    <app-transaction-card *ngFor="let transaction of mockTransactions" [transaction]="transaction"></app-transaction-card>
  </div>

  <div *ngIf="showModal" id="add-tag-modal-wrapper">
    <app-add-tag-modal></app-add-tag-modal>
  </div>
  
</div>
